name: Python Unit Test

on: [push]

jobs:
  test_code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Python Tests
        run: python -m unittest test_calc.py
